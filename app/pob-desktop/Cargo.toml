[package]
name = "pob-desktop"
description = "Desktop entry point of the Rust UI port of Path of Building (ui doc §3): pob_host::run_desktop(cfg, pob_app::PobApp::new)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pob-host.workspace = true
pob-app.workspace = true
pob-gamedata.workspace = true
pob-sg.workspace = true
pob-sg-wgpu.workspace = true
pob-ui-core.workspace = true
anyhow.workspace = true
image.workspace = true
pollster.workspace = true
wgpu = { version = "=30.0.1", features = ["webgl"] }

[dev-dependencies]
# VENDOR's standalone tests read the bundle's index.json.
serde_json.workspace = true

# VENDOR: the start-up shared by the binaries and the standalone tests (asset bundle, game data).
[lib]
name = "pob_desktop"
path = "src/lib.rs"

[[bin]]
name = "pob-desktop"
path = "src/main.rs"

# The SimpleGraphic test card (moved from the pre-port `pob-sg` `sg-demo`; U7 owns it).
[[bin]]
name = "sg-demo"
path = "src/bin/sg_demo.rs"

[lints]
workspace = true
