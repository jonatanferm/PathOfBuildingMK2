[package]
name = "pob-port-desktop"
description = "Desktop entry point of the Rust UI port of Path of Building (ui doc §3): pob_host::run_desktop(cfg, pob_app::PobApp::new)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Dev only: inject pob-ui-oracle's LuaCalcBridge as the calc (ui doc D14, §10.4).
lua-calc = ["dep:pob-ui-oracle"]

[dependencies]
pob-host.workspace = true
pob-app.workspace = true
pob-sg.workspace = true
pob-sg-wgpu.workspace = true
pob-ui-core.workspace = true
pob-ui-oracle = { workspace = true, optional = true }
anyhow.workspace = true
image.workspace = true
pollster.workspace = true
wgpu = { version = "=30.0.1", features = ["webgl"] }

[[bin]]
name = "pob-port-desktop"
path = "src/main.rs"

# The SimpleGraphic test card (moved from the pre-port `pob-sg` `sg-demo`; U7 owns it).
[[bin]]
name = "sg-demo"
path = "src/bin/sg_demo.rs"

[lints]
workspace = true
