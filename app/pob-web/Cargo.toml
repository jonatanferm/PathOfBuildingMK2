[package]
name = "pob-web"
description = "Browser entry point of the Rust UI port of Path of Building (ui doc §3): wasm32 + Trunk, pob_host::run_web(...)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pob-host.workspace = true
pob-app.workspace = true
pob-sg.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Location", "console"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
