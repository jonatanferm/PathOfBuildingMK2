# PF-G acceptance probes (crates/pob-oracle/tests/PF-G.rs). Owned by PF-G.
#
# The segment's own boundary `perform:3497` (copied from docs/port/stages.toml) plus line probes
# around every not-yet-ported callee the segment calls: the state between two consecutive probes
# is exactly one call's in -> out, so the test replays each call (pob_oracle::replay) from the
# main env's hits (`pfg:*@main`; a line probe fires at most once per perform, so the main env's
# first hit is the call). `perform:out` is the patcher's function probe.

[[stage]]
id = "perform:3497"
file = "Modules/CalcPerform.lua"
line = 3498
locals = ["env", "skipEHP", "modDB", "enemyDB", "output", "partyTabEnableExportBuffs", "hasGuaranteedBonechill", "guaranteedChillSkills", "summonedMinionOverride", "breakdown", "nonUniqueFlasksApplyToMinion", "mergeFlasks", "mergeTinctures", "buffs", "guards", "minionBuffs", "debuffs", "curses", "minionCurses", "linkSkills", "allyBuffs", "buffExports", "appliedCombustion", "warcryList"]
