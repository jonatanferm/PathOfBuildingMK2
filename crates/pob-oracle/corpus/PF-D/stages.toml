# PF-D L4 stages (crates/pob-oracle/tests/PF-D.rs): docs/port/stages.toml (U0) verbatim, plus
# line probes around every not-yet-ported callee of CalcPerform.lua 1943-2307, so the test can
# replay each callee's recorded in -> out delta (`pfd:<line>` fires before <line>).
# Fill: scripts/port/oracle.sh run --build X.xml --stages crates/pob-oracle/corpus/PF-D/stages.toml \
#   --stage 'perform:1943@main,perform:2308@main,pfd:*@main,getCachedOutputValue:*@main'

# Line probes at every segment boundary of the split giant functions (calc doc §7, §9.2).
# Owned by U0. Generated from scripts/port/segments.py (the segment table) plus the first-segment
# `:in` probes; `id` is `<function>:<segment start line>` (`:end` = before the final `end`; the
# function probes `<function>:in` / `<function>:out` are the patcher's).
# A probe fires *before* `line` runs (the first statement at/after the boundary) and dumps `locals`
# (the ctx fields of calc doc §7.2 declared by then). The `:out` of a segment is the `:in` of the next
# one. `expect` must occur in the original line (guards against upstream drift).
# Function probes (`calcs.initEnv:in/out`, `perform`, `offence`, …) are the patcher's built-in list.

