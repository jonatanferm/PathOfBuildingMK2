# A compound assignment line (PoB's `+=`): the patcher must apply the
# loader's rewrite before prefixing it. Not reached while loading a build.
[[stage]]
id = "main:modcache:count"
file = "Modules/Main.lua"
line = 342
locals = ["count"]
expect = "count += 1"

