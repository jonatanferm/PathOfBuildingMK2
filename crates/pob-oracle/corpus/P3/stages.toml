# Dummy stages for the P3 tests (U0 writes the real docs/port/stages.toml).
# Line probes fire *before* the given line runs; `locals` are dumped by
# name; `expect` must occur in the original line (guards upstream drift).

# initEnv segments (calc doc §7.1: 475 · 800 · 1451)
[[stage]]
id = "initEnv:items:in"
file = "Modules/CalcSetup.lua"
line = 800
locals = ["build", "mode", "specEnv", "env", "accelerate", "override", "modDB"]
expect = "if not accelerate.requirementsItems then"

[[stage]]
id = "initEnv:skills:in"
file = "Modules/CalcSetup.lua"
line = 1451
locals = ["env", "accelerate", "override", "modDB"]
expect = "if not accelerate.skills then"

# perform segments (1286 · 1943 · 2308 · 2997 · 3497)
