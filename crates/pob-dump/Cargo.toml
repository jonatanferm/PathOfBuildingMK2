[package]
name = "pob-dump"
description = "Faithful dump of Path of Building's loaded data (run under LuaJIT) to canonical JSON, plus enum codegen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pob-dump"
path = "src/main.rs"

[dependencies]
mlua.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2 = "0.10"

[dev-dependencies]
# the generated record structs (generated/*.rs) derive serde
serde.workspace = true
# serde_json's default float parser can be 1 ulp off; the dump's numbers
# round-trip exactly only with float_roundtrip (e.g. data.misc.stdBossDPSMult)
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
