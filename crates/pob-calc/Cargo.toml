[package]
name = "pob-calc"
description = "Faithful Rust port of Path of Building's calculation pipeline (calc doc §2, §5-§8). No Lua runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The six crates of the split (CCR-0131); this crate re-exports them (docs/port/calc-split-plan.md §4).
pob-calc-core.workspace = true
pob-calc-setup.workspace = true
pob-calc-config.workspace = true
pob-calc-defence.workspace = true
pob-calc-offence.workspace = true
pob-calc-perform.workspace = true

[dev-dependencies]
# tests/hyg1_len.rs and tests/ctor_pairs.rs (pob_lua::Name, tostring_num).
pob-lua.workspace = true
# benches/INT-2.rs: data.bin and the timeless jewel LUTs.
pob-gamedata.workspace = true
# tests/leak1_cycles.rs: the gitignored inputs (data/dump, .parity/builds).
pob-testpaths.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# HYG1 `#t` property test against LuaJIT (tests/hyg1_len.rs). Dev-only: the calc has no Lua runtime.
mlua.workspace = true
# benches/INT-2.rs: process CPU time.
rustix = { version = "1", features = ["time"] }

[features]
default = []
# State export for the oracle (calc doc §9.2, ORC-X): `probe!` and `ProbeState`, on all six crates.
probe = [
    "pob-calc-core/probe",
    "pob-calc-setup/probe",
    "pob-calc-config/probe",
    "pob-calc-defence/probe",
    "pob-calc-offence/probe",
    "pob-calc-perform/probe",
]

# Gate INT-2 (calc doc §9.7): full recalc and power report timings (scripts/port/perf_bench.sh).
[[bench]]
name = "INT-2"
harness = false

[lints]
workspace = true
