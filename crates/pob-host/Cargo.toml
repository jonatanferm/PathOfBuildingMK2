[package]
name = "pob-host"
description = "Window/event-loop hosts for the PoB UI port (ui doc §5.2): the App trait, desktop (winit) and web (wasm32) hosts, the headless host, input mapping, pacing, image loaders, Platform/Fs/Net implementations and the .pobscript scenario DSL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pob-sg.workspace = true
pob-sg-wgpu.workspace = true
pob-lua.workspace = true
anyhow.workspace = true
image.workspace = true
winit.workspace = true
wgpu = { version = "=30.0.1", features = ["webgl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "Element"] }

[lints]
workspace = true
