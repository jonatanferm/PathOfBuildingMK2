[package]
name = "pob-app"
description = "Path of Building itself on the Rust UI port (ui doc §3, §10): Launch, Main, BuildList and Build modes, every tab, the passive tree view, tooltips and the calc facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pob-ui-core.workspace = true
pob-sg.workspace = true
pob-host.workspace = true
pob-lua.workspace = true
# The calc plan's crates (calc doc §2): the model and the calc, as U0 stubs until their units land.
pob-calc.workspace = true
# Also U44 (ImportTab B): `modLib.parseMod` of item flavour text (CCR-0117 §5).
pob-modparser.workspace = true
pob-gamedata.workspace = true
indexmap.workspace = true
# The tree view's asset and sprite maps (U53 perf pass)
ahash.workspace = true
# U43 (ImportTab): dkjson.decode, PoEAPI's sha2. SimpleGraphic's Deflate/Inflate are
# pob-gamedata's `sg_zlib` (FUP7).
serde_json.workspace = true
sha2 = "0.10"

# U54 (WorkerCalc, calc/worker_web.rs): the Web Worker, its message events, the data fetches and
# the worker's panic hook (calc doc D15).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys = "0.3"
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "Response", "console", "Worker", "WorkerOptions",
    "WorkerType", "MessageEvent", "ErrorEvent", "Blob", "BlobPropertyBag", "Url",
    "WorkerGlobalScope", "DedicatedWorkerGlobalScope",
] }

[dev-dependencies]
# U28's unit tests: a small `data.powerStatList` and an item base from JSON.
serde_json.workspace = true
# Oracle-backed tests (tests/*.rs, e.g. party_notes_desc.rs) find the gitignored PoB checkout.
pob-testpaths.workspace = true

[lints]
workspace = true
