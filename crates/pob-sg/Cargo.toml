[package]
name = "pob-sg"
description = "SimpleGraphic-equivalent renderer for the Rust port of Path of Building: draw-command recording core, TGF/TGA bitmap fonts, image handles, wgpu backend and a winit host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# wgpu backend: batched tinted textured quads (desktop + WebGL2).
gpu = ["dep:wgpu", "dep:bytemuck"]
# Desktop window/event-loop host (winit) mapping input to PoB semantics.
host = ["gpu", "dep:winit", "dep:arboard", "dep:pollster"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
wgpu = { version = "30.0.1", optional = true, features = ["webgl"] }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
winit = { version = "0.30.13", optional = true }
pollster = { version = "1.0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6.1", optional = true, default-features = false }

[[bin]]
name = "sg-demo"
path = "src/bin/sg-demo.rs"
required-features = ["host"]

[lints]
workspace = true

[dev-dependencies]
pollster = "1.0.1"
