[package]
name = "pob-sg"
description = "Pure SimpleGraphic equivalent for the Rust port of Path of Building (ui doc §4): layer queues, DPI, colour escapes, TGF/TGA bitmap fonts, image registry, trace. No GPU, no winit, no threads, no std::fs; builds for wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# CPU reference rasteriser (Frame -> RGBA), ui doc §3 `raster.rs` (U6).
raster = []

[dependencies]
pob-lua.workspace = true
image.workspace = true
bitflags.workspace = true
serde.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Test inputs (PoB's fonts) and the skip policy (HYG1).
pob-testpaths.workspace = true

[lints]
workspace = true
