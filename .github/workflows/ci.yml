name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR so we only ever pay for the
# tip of a branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (calc engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Headless calc-engine crates (no native UI deps). The UI crate is
      # gated separately in the `ui` job below, which installs the extra
      # Linux system libs that `winit` / `wgpu` / `eframe` / `rfd` need.
      - name: cargo build (engine)
        run: cargo build -p pob-engine -p pob-data -p pob-extract --all-targets

      - name: cargo test (engine)
        # Some integration tests require generated data (under `data/`, which
        # is gitignored) and self-skip when it's missing. Data-independent
        # tests (mod_parser, mod_db, parser coverage, validation) still run.
        run: cargo test -p pob-engine -p pob-data -p pob-extract

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    # Issue #49: promoted from advisory to required. Main is now
    # `cargo fmt --check` clean, so this gates every PR against
    # rustfmt drift instead of letting it accumulate.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    # Issue #49: promoted from advisory to required. The workspace
    # is now `cargo clippy ... -- -D warnings` clean across the
    # engine crates, so this gates every PR against new lint
    # introductions instead of letting warnings drift.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo clippy (engine)
        # Same deal as the test job: limit to the headless calc-engine crates
        # so we don't need the Linux UI system packages.
        # Issue #49: `-D warnings` makes clippy fail on lint introductions.
        run: cargo clippy -p pob-engine -p pob-data -p pob-extract --all-targets -- -D warnings

  ui:
    name: cargo test + clippy (UI port)
    runs-on: ubuntu-latest
    # The UI is the port of PoB's own UI (docs/port/ui-architecture.md): pob-sg (the
    # SimpleGraphic equivalent), pob-sg-wgpu, pob-host, pob-ui-core, pob-app and the apps
    # app/pob-desktop and app/pob-web (U53's cut-over replaced the egui crate pob-ui). Tests that
    # need the gitignored PoB checkout or data dump skip under POB_ALLOW_SKIP=1.
    env:
      POB_ALLOW_SKIP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install UI system libraries
        # winit/wgpu need xkbcommon + wayland + xcb dev headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo build (pob-desktop)
        run: cargo build -p pob-desktop

      - name: cargo check (pob-web, wasm32)
        run: cargo check -p pob-web --target wasm32-unknown-unknown

      - name: cargo clippy (UI crates)
        run: cargo clippy -p pob-sg -p pob-host -p pob-ui-core -p pob-app -p pob-desktop --all-targets -- -D warnings

      - name: cargo test (pob-sg, pob-ui-core)
        run: cargo test -p pob-sg -p pob-ui-core

  # Optional: run pob_diff against an upstream PoB checkout. Manual trigger
  # only — the upstream PoB repo is not redistributable as a CI artifact, so
  # this job is meant for maintainers who clone PoB locally and want to
  # publish a regression run on demand.
  pob-diff:
    name: pob_diff regression (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout upstream PoB into .PathOfBuilding
        uses: actions/checkout@v4
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          path: .PathOfBuilding

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: pob_diff (witch L90 Arc)
        run: |
          cargo run --release -p pob-extract --bin pob_diff -- \
            --build crates/pob-extract/test-builds/witch_l90_arc_with_items.xml

      - name: pob_diff (marauder L90 bleeding cleave)
        run: |
          cargo run --release -p pob-extract --bin pob_diff -- \
            --build crates/pob-extract/test-builds/marauder_l90_bleeding_cleave.xml

      # Issue #197: corrupted cluster jewel build — exercises the full
      # XML→synth pipeline against PoB's authoritative output, covering
      # both `+1 socket` and `+50% increased Effect` corruption rolls.
      - name: pob_diff (marauder L90 corrupted cluster jewel)
        run: |
          cargo run --release -p pob-extract --bin pob_diff -- \
            --build crates/pob-extract/test-builds/marauder_l90_corrupted_cluster.xml
