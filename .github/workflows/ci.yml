name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR so we only ever pay for the
# tip of a branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (calc)
    runs-on: ubuntu-latest
    # The Rust calc (docs/port/calc-architecture.md): pob-lua, pob-gamedata, pob-modparser and the
    # pob-calc crates. Tests that need the gitignored PoB checkout or data dump skip under
    # POB_ALLOW_SKIP=1. INT-4 deleted the legacy pob-engine / pob-data / pob-extract this job ran.
    env:
      POB_ALLOW_SKIP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml (pinned).
          toolchain: "1.100"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: No Lua at runtime (calc doc D4, INT-4 gate)
        # mlua must not be in the normal dependency tree of the calc or of a shipping product.
        run: |
          for p in pob-calc pob-app pob-desktop pob-web; do
            n=$(cargo tree -p "$p" -e normal | grep -c mlua || true)
            echo "$p: $n"
            test "$n" = 0
          done

      - name: cargo check (runtime crates, wasm32)
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p pob-lua -p pob-gamedata -p pob-modparser
          -p pob-calc-core -p pob-calc-setup -p pob-calc-config -p pob-calc-defence
          -p pob-calc-offence -p pob-calc-perform -p pob-calc

      - name: cargo test (pob-lua, pob-gamedata, pob-modparser)
        run: cargo test -p pob-lua -p pob-gamedata -p pob-modparser

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    # Issue #49: promoted from advisory to required. Main is now
    # `cargo fmt --check` clean, so this gates every PR against
    # rustfmt drift instead of letting it accumulate.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml (pinned).
          toolchain: "1.100"
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  ui:
    name: cargo test + clippy (UI port)
    runs-on: ubuntu-latest
    # The UI is the port of PoB's own UI (docs/port/ui-architecture.md): pob-sg (the
    # SimpleGraphic equivalent), pob-sg-wgpu, pob-host, pob-ui-core, pob-app and the apps
    # app/pob-desktop and app/pob-web (U53's cut-over replaced the egui crate pob-ui). Tests that
    # need the gitignored PoB checkout or data dump skip under POB_ALLOW_SKIP=1.
    env:
      POB_ALLOW_SKIP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install UI system libraries
        # winit/wgpu need xkbcommon + wayland + xcb dev headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain (with clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml (pinned).
          toolchain: "1.100"
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cargo build (pob-desktop)
        run: cargo build -p pob-desktop

      - name: cargo check (pob-web, wasm32)
        run: cargo check -p pob-web --target wasm32-unknown-unknown

      - name: cargo clippy (UI crates)
        # --no-deps: lint only these crates; their workspace dependencies (pob-lua, the calc
        # crates) are not clippy-clean under -D warnings (pob-lua's inline(always) helpers).
        run: cargo clippy --no-deps -p pob-sg -p pob-host -p pob-ui-core -p pob-app -p pob-desktop --all-targets -- -D warnings

      - name: cargo test (pob-sg, pob-ui-core)
        run: cargo test -p pob-sg -p pob-ui-core

  # The legacy `pob_diff` job (pob-extract, against the hand-written pob-engine) is gone with
  # those crates (INT-4). Parity against PoB is the pob-oracle suite (docs/port/testing.md),
  # which needs the PoB checkout, the data dump and the corpus, so it runs locally.
