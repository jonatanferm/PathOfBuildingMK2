[workspace]
resolver = "2"
members = [
    "crates/pob-lua",
    "crates/pob-gamedata",
    "crates/pob-modparser",
    "crates/pob-calc",
    # The pob-calc split (CCR-0131): pob-calc is their facade.
    "crates/pob-calc-core",
    "crates/pob-calc-setup",
    "crates/pob-calc-config",
    "crates/pob-calc-defence",
    "crates/pob-calc-offence",
    "crates/pob-calc-perform",
    "crates/pob-oracle",
    "crates/pob-sg",
    # Build-time data dump tool (LuaJIT; AMENDMENTS A1/A2). INT-4 deleted the legacy
    # `pob-engine`, `pob-data` and `pob-extract` (AMENDMENTS A13).
    "crates/pob-dump",
    # UI port (ui doc §3, D16). U53's cut-over deleted the legacy egui UI (`crates/pob-ui`) and
    # renamed `app/pob-port-{desktop,web}` to `app/pob-{desktop,web}`.
    "crates/pob-sg-wgpu",
    "crates/pob-host",
    "crates/pob-ui-core",
    "crates/pob-app",
    "crates/pob-ui-oracle",
    "app/pob-desktop",
    "app/pob-web",
    # Test-only input locator and skip policy (HYG1); dev-dependency only.
    "crates/pob-testpaths",
    # VENDOR: writes the asset bundle (assets/) from a PoB checkout; not shipped.
    "tools/pob-vendor",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/jferm/PathOfBuildingMK2"

[workspace.dependencies]
pob-lua = { path = "crates/pob-lua" }
pob-gamedata = { path = "crates/pob-gamedata" }
pob-modparser = { path = "crates/pob-modparser" }
pob-calc = { path = "crates/pob-calc" }
# The crates pob-calc is split into (CCR-0131). Only the calc crates depend on them; everything
# else depends on pob-calc.
pob-calc-core = { path = "crates/pob-calc-core" }
pob-calc-setup = { path = "crates/pob-calc-setup" }
pob-calc-config = { path = "crates/pob-calc-config" }
pob-calc-defence = { path = "crates/pob-calc-defence" }
pob-calc-offence = { path = "crates/pob-calc-offence" }
pob-calc-perform = { path = "crates/pob-calc-perform" }
pob-oracle = { path = "crates/pob-oracle" }
# UI port crates (ui doc §3).
pob-sg = { path = "crates/pob-sg" }
pob-sg-wgpu = { path = "crates/pob-sg-wgpu" }
pob-host = { path = "crates/pob-host" }
pob-ui-core = { path = "crates/pob-ui-core" }
pob-app = { path = "crates/pob-app" }
pob-ui-oracle = { path = "crates/pob-ui-oracle" }
# Test-only (HYG1): gitignored test inputs + skip policy. Never a normal dependency.
pob-testpaths = { path = "crates/pob-testpaths" }

# General
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
smallvec = { version = "1", features = ["serde", "union"] }
indexmap = { version = "2", features = ["serde"] }
ahash = "0.8"
bitflags = { version = "2", features = ["serde"] }
# Interned strings (pob-lua `Name`).
ustr = "1"

# LuaJIT, for the build-time dump tool (pob-dump), the dev-only oracles (pob-oracle,
# pob-ui-oracle) and dev-dependencies. No runtime crate may depend on it (calc doc D4, §2 rule 3;
# INT-4 gate: `cargo tree -p pob-calc -e normal | grep -c mlua` = 0).
mlua = { version = "0.10", features = ["luajit", "vendored", "send"] }

# Compression (PoB share codes, Lua Inflate/Deflate)
flate2 = "1"

# UI
bytemuck = { version = "1", features = ["derive"] }

# UI port pins (ui doc §3 "Pinned versions (new crates only)"). wgpu is pinned per crate
# (`wgpu = "=30.0.1"`, newest stable at UI-U0); the workspace key `wgpu = "22"` of the legacy
# eframe app is gone with that app (U53, INT-4).
winit = "=0.30.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
slotmap = "1.1"
arboard = { version = "3.6", default-features = false }
scoped-tls-hkt = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ron = "0.8"
pollster = "1.0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Stylistic noise from pedantic that's not worth chasing for an active port.
uninlined_format_args = "allow"
doc_markdown = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
ignored_unit_patterns = "allow"
match_same_arms = "allow"
return_self_not_must_use = "allow"
manual_let_else = "allow"
explicit_iter_loop = "allow"
match_wildcard_for_single_variants = "allow"
unnested_or_patterns = "allow"
# Issue #49: float comparisons against pinned outputs are
# intentional in the calc engine + tests. Asserting `out.get(...)
# == 75.0` is the readable way to write "this stat is exactly 75
# in this fixture". The pedantic warning catches a real footgun in
# general but in our case it's noise.
float_cmp = "allow"
# Issue #49: pedantic stylistic lints we trade away to keep the
# (now deleted, INT-4) pob_data extractor + parser path tractable. Each is a real
# preference signal in greenfield code but not worth a churn pass
# in already-shipping modules.
manual_strip = "allow"
unreadable_literal = "allow"
assigning_clones = "allow"
implicit_hasher = "allow"
too_many_arguments = "allow"
cast_possible_wrap = "allow"
default_trait_access = "allow"
from_iter_instead_of_collect = "allow"
# Issue #49 (slice 3): final wave to clear clippy. These are all
# stylistic preferences; the value of `-D warnings` is catching
# real errors before they ship, not bikeshedding on
# `map(...).unwrap_or(...)` vs `map_or(...)`.
map_unwrap_or = "allow"
collapsible_if = "allow"
bool_to_int_with_if = "allow"
borrow_as_ptr = "allow"
explicit_counter_loop = "allow"
redundant_closure_for_method_calls = "allow"
unnecessary_debug_formatting = "allow"
manual_midpoint = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
manual_clamp = "allow"
large_enum_variant = "allow"
filter_next = "allow"
unnecessary_to_owned = "allow"
if_not_else = "allow"

[profile.dev]
debug = "line-tables-only"

# Third-party crates optimised in dev/test builds: the oracle tests parse large JSON dumps over the
# whole corpus, and sccache shares these artefacts across worktrees (workspace crates stay at -O0).
[profile.dev.package."*"]
opt-level = 2

# The smaller crates under test run at opt-level 1 in dev/test (keeps debug assertions and overflow
# checks, which are profile settings); see the pob-calc note below.
[profile.dev.package.pob-lua]
opt-level = 1
[profile.dev.package.pob-gamedata]
opt-level = 1
[profile.dev.package.pob-modparser]
opt-level = 1
# pob-calc stays at -O0: at opt-level 1 one rustc peaked at 3.3 GB and two concurrent compiles
# tripped the OOM guard and the 5 GB cargo cap (2026-11-10).

[profile.release]
lto = "thin"
codegen-units = 1
