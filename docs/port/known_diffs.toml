reason = "Multiplier/PerStat tag text of a mod table row ('per <div> <var>'): for a tag with divVar, PoB prints the div that the last EvalMod wrote into the shared, data-owned tag (ModStore.lua:401, 499; whichever store and cfg evaluated it last). The Rust calc never writes it (calc doc §5.3), so the port prints actor.modDB:GetMultiplier(tag.divVar, cfg) of the breakdown's actor and section cfg (ui doc §13 item 14). The only divVar tags at the pin are the two Rage Vortex stat-map mods (Data/Skills/act_str.lua:9102, 9105; CCR-0015 §1)."
