kind = "value"
reason = "Host artefact (ARM64 oracle only): s_format(\"= %d\", lifeProtected) at CalcDefence.lua:2498 with lifeProtected = 0 / (0 / 100) * 1 = NaN when no Frost Shield is active. x64 PoB (cvttsd2si, the profile the port follows) prints -9223372036854775808; the ARM64 dual-number oracle saturates the cast and prints 0 (inf: +-9223372036854775807). Tolerated only on aarch64 hosts by crates/pob-oracle/tests/DF-E.rs (is_int_cast_artefact). CCR-0001 / AMENDMENTS A6."
ccr = "CCR-0001"

