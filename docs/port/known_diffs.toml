# Known, accepted differences between PoB (the oracle) and the Rust calc (calc doc §9.4 L4/L5).
# Owned by U0 (format); entries are added by the unit that owns the code, in the same PR,
# each with its reason. The diff tools (pob_calc_diff, the L4 segment tests) skip a mismatch only
# when an entry here matches it exactly.
#
# Format:
#   [[diff]]
#   id = "<unit>-<n>"                       # unique, e.g. "OF-D-1"
#   unit = "<unit id>"                      # owner (calc doc §11.1)
#   builds = ["<build stem>", …]            # or ["*"]
#   stage = "<stage id or 'outputs'>"       # e.g. "offence:2174", "perform:end", "outputs"
#   keys = ["<flattened key path>", …]      # as pob_calc_diff prints them; "*" suffix = prefix match
#   kind = "value" | "order" | "missing" | "extra" | "sign-of-zero"
#   reason = "<why; cite the Lua file:line and the CCR when there is one>"
#   ccr = "<CCR-NNNN>"                      # optional
#
# Host-artefact classes accepted globally (no entry needed per key):
#   - "sign-of-zero" differences against an ARM64 (dual-number) oracle: CCR-0001 / CCR-0002.
#   - order-only differences of string-keyed tables recorded by the nondeterminism runs
#     (.parity/nondet, calc doc §9.5, CCR-0010 §4).
#
# No entries yet (U0 ships stubs only).

[[diff]]
id = "OF-A-1"
unit = "OF-A"
builds = ["allflame_exp_013", "allflame_exp_036", "allflame_exp_051", "upstream_Dual_Savior", "upstream_Mirage_Archer_Toxic_Rain"]
stage = "offence:362"
keys = ["locals.output.ActiveTrapLimit", "locals.output.ActiveMineLimit", "locals.skillModList.mods"]
kind = "value"
reason = "L4 inject limit, not a port difference: these offence calls run in a mirage env (env8, stack mirages:in → perform:in → offence:in) on a skill copied from the main env (CalcActiveSkill copyActiveSkill), whose baseSkillModList.parent is the main env's modDB, dumped as {\"$foreign\": {env, path}}. A dump holds one env, so injection leaves that parent unlinked and every skillModList query through it misses the main env's mods: CalcOffence.lua:560/562 (`Sum('BASE', skillCfg, 'ActiveTrapLimit')` → 0 instead of the 'Base' 15) and the conversions reading the player's mods (652-664 Spell→Attack damage, 680-685 projectile speed → bow damage). The OF-A L4 test counts these hits apart (`$foreign` mod-store parent)."
ccr = "CCR-0041"
