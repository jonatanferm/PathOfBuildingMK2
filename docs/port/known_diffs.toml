[[diff]]
id = "MP3-1"
unit = "MP3"
builds = ["*"]
stage = "parse"
keys = [
    "Modules/ModParser.lua:2325 mod[1].div",
    "Modules/ModParser.lua:2571 mod[1].div",
    "Modules/ModParser.lua:2862 mod[1].div",
    "Modules/ModParser.lua:2922 mod[1].limit",
]
kind = "value"
reason = "specialModList closures store a digits-only capture string in a numeric tag field (div = val / div = div, limit = max); the Rust Tag field is f64 and holds tonumber of it. EvalMod reads these fields only in arithmetic, which coerces the string exactly like tonumber, so no calc output can differ (calc doc §6 'Known parse-level differences'). crates/pob-oracle/tests/MP3.rs accepts the difference only when the string is the number's own text (77 closure calls and 5 parse-oracle lines at the pin)."

